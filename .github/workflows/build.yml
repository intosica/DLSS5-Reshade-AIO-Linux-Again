name: Build Addon

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Update Submodules
      run: git submodule update --init --recursive

    - name: Fix Header Case Sensitivity
      run: |
        find . -type f \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" \) -exec sed -i 's/#include <Windows.h>/#include <windows.h>/g' {} +

    - name: Install MinGW Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=mingw-w64-x86_64.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
          -DFEEDER_ROOT="${{ github.workspace }}/external/DLSS5-Feeder"

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dlss5-addon
        path: |
          build/*.addon64
          build/*.dll
